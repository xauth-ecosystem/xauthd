[package]
name = "xauth-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.32", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.10"
prost = "0.12"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "mysql", "chrono"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.10"
