[package]
name = "xauth-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.32", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.10"
prost = "0.12"
sea-orm = { version = "1.1.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "1.1.0"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.0"
axum = "0.7"
askama = "0.12"
uuid = { version = "1.8", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rsa = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.10"
