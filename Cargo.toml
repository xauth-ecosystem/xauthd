[package]
name = "xauth-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.32", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
prost = "0.14"
sea-orm = { version = "2.0.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "2.0.0"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.0"
axum = "0.8"
uuid = { version = "1.8", features = ["v4"] }
sha2 = "0.11"
base64 = "0.22"
rsa = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
config = { version = "0.15.25", features = ["toml"] }
bcrypt = "0.19.3"
clap = { version = "4.6.4", features = ["derive"] }
daemonize = "0.5.0"
rand = "0.10.2"
minijinja = { version = "2.21.0", features = ["loader"] }
tower-http = { version = "0.7.0", features = ["fs"] }

[build-dependencies]
tonic-build = "0.14"
