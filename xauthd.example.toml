# XAuth Core Daemon Configuration

[database]
# The connection string for the database.
# Supports SQLite, MySQL, and PostgreSQL out of the box via SeaORM.
# Examples:
# SQLite:    sqlite://data.sqlite?mode=rwc
# MySQL:     mysql://user:password@localhost/xauth
# Postgres:  postgres://user:password@localhost/xauth
url = "sqlite://data.sqlite?mode=rwc"

[redis]
# If enabled, xauthd switches to Cluster Mode for horizontal scalability.
# This uses Redis Pub/Sub as a MessageBus to synchronize bidirectional
# gRPC streaming connections (like KICK_PLAYER commands) across all running instances.
# Leave disabled if you are only running a single instance of xauthd.
enabled = false
# The connection string for the Redis server.
# Example: redis://user:password@localhost:6379/
url = "redis://127.0.0.1:6379/"

[network]
# Address and port for the gRPC daemon (backend communication)
grpc_address = "0.0.0.0:50051"
# Address and port for the Web HTTP server (OAuth2, OIDC, web dashboard)
web_address = "0.0.0.0:8080"

[web]
# Path to the directory containing HTML templates (Jinja2 syntax).
# Server owners can freely edit these files to customize the look and feel.
# Changes are picked up on the next page load — no restart required.
templates_dir = "./templates"
# Path to the directory for static assets (CSS, JS, images, fonts).
# Files from this directory are served under the /static/ URL prefix.
# Leave empty or remove if you prefer to use CDN links in your templates.
public_dir = "./public"

[password_hashing]
# Available algorithms: BCRYPT, ARGON2ID
algorithm = "BCRYPT"

[password_hashing.options.BCRYPT]
# The algorithmic cost that should be used. Ranges from 4 to 31.
# Higher cost means more secure but slower hashing. Recommended: 10-12.
cost = 10

[password_hashing.options.ARGON2ID]
# Maximum memory (in kibibytes) that Argon2 will use. Default: 65536 (64MB).
memory_cost = 65536
# Maximum amount of time (in iterations) that Argon2 will spend. Default: 4.
time_cost = 4
# Number of threads that Argon2 will use. Default: 1.
threads = 1

[jwt]
# Secret used for symmetric JWT tokens (like internal sessions)
secret = "super_secret_key_change_me_to_something_random"
# Path to the RSA private key used for OIDC/JWKS asymmetric signing
# If the file does not exist, the daemon will automatically generate it at this location.
rsa_private_key_path = "private_key.pem"
# Lifespan of a regular in-game session token (Auto-Login duration) in seconds. Default: 86400 (24 hours).
session_ttl = 86400
# Lifespan of an OAuth2 Authorization Code in seconds. Default: 600 (10 minutes).
auth_code_ttl = 600
# Lifespan of an OAuth2 Access Token in seconds. Default: 3600 (1 hour).
access_token_ttl = 3600
# Lifespan of an OAuth2 Refresh Token in seconds. Default: 604800 (7 days).
refresh_token_ttl = 604800

[security]
# Maximum allowed failed password attempts across all interfaces (Game and Web).
# Upon reaching this limit, the account is locked and cannot authenticate until reset.
max_failed_attempts = 5
# Time (in seconds) after which the failed attempts counter resets automatically.
# Default: 900 (15 minutes).
failed_attempts_reset_interval = 900

[totp]
# If true, the totp step in the login chain is enforced.
# Players without2FA will be forced to set it up.
required = false

[auth_flow]
# Order of authentication steps for players who are not registered yet
register_chain = ["captcha", "register"]
# Order of authentication steps for players who are already registered
login_chain = ["password", "totp"]
# Number of failed attempts allowed per step before the player is kicked
max_attempts_per_step = 3

[rate_limit]
# Enable IP-based rate limiting on sensitive endpoints (login, register, grpc auth)
enabled = true
# Maximum number of authentication attempts allowed per IP address within the time window.
max_attempts_per_ip = 10
# Maximum number of authentication attempts allowed per username within the time window.
max_attempts_per_username = 5
# Time window in seconds for the rate limit. Default: 60 (1 minute).
window_seconds = 60
